<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>User Context</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            color: white;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        label {
            font-weight: bold;
            display: block;
            margin: 10px 0 5px;
            text-align: left;
            font-size: 14px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00c6ff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.3s ease-in-out;
            box-shadow: 0 3px 8px rgba(0, 198, 255, 0.3);
        }
        button:hover {
            background: #007bbf;
            box-shadow: 0 4px 10px rgba(0, 123, 191, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enter Your Details</h2>
        
        <label>Location Type</label>
        <select id="location_type">
            <option value="urban">Urban</option>
            <option value="rural">Rural</option>
        </select>
        
        <label>Health Condition</label>
        <select id="user_health">
            <option value="general">General</option>
            <option value="asthma">Asthma</option>
            <option value="athlete">Athlete</option>
        </select>
        
        <label>Environment</label>
        <select id="environment">
            <option value="indoor">Indoor</option>
            <option value="outdoor">Outdoor</option>
        </select>
        
        <label>Daily Activity</label>
        <select id="daily_activity">
            <option value="exercise">Exercise</option>
            <option value="commute">Commute</option>
        </select>
        
        <button onclick="submitContext()">Next: Enter Sensor Data</button>
    </div>

    <script>
        function submitContext() {
            let userContext = {
                location_type: document.getElementById("location_type").value,
                user_health: document.getElementById("user_health").value,
                environment: document.getElementById("environment").value,
                daily_activity: document.getElementById("daily_activity").value
            };

            fetch("http://localhost:8000/context/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(userContext)
            }).then(() => {
                window.location.href = "/sensor";
            });
        }
    </script>
</body>
</html>
